<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Creador de Ligas</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        h1 { color: #333; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 10px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h1>🏆 Creador de Ligas</h1>
    <p>Escribe los nombres de los equipos separándolos por comas:</p>

    <form action="/crear-liga" method="POST">
        <textarea name="equipos" placeholder="Ejemplo: Bad Jr, Mercat Nou, Sants Siete, Poblenou Pumas"></textarea>
        <br>
        <button type="submit">Generar Calendario</button>
    </form>

</body>
</html>
